<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sudoku Game</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <h1>Sudoku Game</h1>
  <div id="sudoku-board"></div>
  <div class="controls">
    <div class="difficulty-controls" aria-label="Difficulty selector">
      <button class="difficulty-btn active" data-difficulty="easy">Easy</button>
      <button class="difficulty-btn" data-difficulty="medium">Medium</button>
      <button class="difficulty-btn" data-difficulty="hard">Hard</button>
    </div>
    <button id="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false">Dark Mode</button>
    <button id="new-game">New Game</button>
    <button id="check-solution">Check Solution</button>
    <button id="hint-button">Hint</button>
    <span id="timer" aria-live="polite">00:00</span>
    <span id="message"></span>
  </div>
  <div id="leaderboard-panel" aria-live="polite">
    <h2>Top 10 Leaderboard</h2>
    <ol id="leaderboard-list"></ol>
  </div>
  <script src="/static/main.js"></script>
</body>
</html>
